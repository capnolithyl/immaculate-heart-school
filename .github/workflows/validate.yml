name: Validate School Child Theme

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tailwind/PostCSS
        run: npm install --no-audit --no-fund

      - name: Validate PHP
        run: |
          find theme -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test packaging and deployment guardrails
        run: npm run test

      - name: Build school ZIP
        run: npm run bundle

      - name: Verify ZIP contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('ihm-school.zip') as archive:
              names = archive.namelist()
              assert 'ihm-school/style.css' in names
              assert 'ihm-school/functions.php' in names
              assert 'ihm-school/assets/css/school.css' in names
              assert all(name.startswith('ihm-school/') for name in names)
          PY
